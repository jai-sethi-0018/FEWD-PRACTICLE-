<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jai Sethi - Weather Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .weather-card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }
        h2 {
            color: #1e293b;
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input {
            flex: 1;
            padding: 10px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        button {
            padding: 10px 18px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0369a1;
        }
        .weather-icon {
            font-size: 64px;
            margin: 10px 0;
        }
        .temp {
            font-size: 42px;
            font-weight: bold;
            color: #0f172a;
        }
        .city-name {
            font-size: 22px;
            color: #334155;
            margin-top: 5px;
        }
        .condition {
            font-size: 15px;
            color: #64748b;
            margin-bottom: 20px;
        }
        .details {
            display: flex;
            justify-content: space-around;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 10px;
        }
        .detail-box p:first-child {
            font-size: 13px;
            color: #64748b;
        }
        .detail-box p:last-child {
            font-size: 18px;
            font-weight: bold;
            color: #1e293b;
            margin-top: 4px;
        }
        .error {
            color: #dc2626;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="weather-card">
        <h2>Weather Dashboard</h2>
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name (e.g. Delhi)">
            <button id="searchBtn">Search</button>
        </div>

        <div id="weatherResult">
            <div class="weather-icon" id="weatherIcon">⛅</div>
            <div class="temp" id="temperature">--°C</div>
            <div class="city-name" id="cityName">Search a City</div>
            <div class="condition" id="conditionText">Real-time weather updates</div>

            <div class="details">
                <div class="detail-box">
                    <p>Humidity</p>
                    <p id="humidity">--%</p>
                </div>
                <div class="detail-box">
                    <p>Wind Speed</p>
                    <p id="windSpeed">-- km/h</p>
                </div>
            </div>
        </div>
        <div class="error" id="errorMsg"></div>
    </div>

    <script>
        const cityInput = document.getElementById("cityInput");
        const searchBtn = document.getElementById("searchBtn");
        const errorMsg = document.getElementById("errorMsg");

        // Function to map weather codes to icons & descriptions
        function getWeatherDetails(code) {
            if (code === 0) return { icon: "☀️", text: "Clear Sky" };
            if (code >= 1 && code <= 3) return { icon: "⛅", text: "Partly Cloudy" };
            if (code >= 45 && code <= 48) return { icon: "🌫️", text: "Foggy" };
            if (code >= 51 && code <= 67) return { icon: "🌧️", text: "Rainy" };
            if (code >= 71 && code <= 77) return { icon: "❄️", text: "Snowfall" };
            if (code >= 80 && code <= 99) return { icon: "⛈️", text: "Thunderstorm" };
            return { icon: "🌤️", text: "Moderate Weather" };
        }

        // Async/Await function using Fetch API
        async function getWeather(city) {
            errorMsg.textContent = "";
            try {
                // Step 1: Fetch city coordinates (Geocoding API)
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
                const geoData = await geoRes.json();

                if (!geoData.results || geoData.results.length === 0) {
                    errorMsg.textContent = "City not found! Please try another city.";
                    return;
                }

                const { latitude, longitude, name, country } = geoData.results[0];

                // Step 2: Fetch real-time weather data using coordinates
                const weatherRes = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m`
                );
                const weatherData = await weatherRes.json();
                const current = weatherData.current;

                // Update DOM dynamically
                const weatherInfo = getWeatherDetails(current.weather_code);
                document.getElementById("weatherIcon").textContent = weatherInfo.icon;
                document.getElementById("temperature").textContent = `${current.temperature_2m}°C`;
                document.getElementById("cityName").textContent = `${name}, ${country}`;
                document.getElementById("conditionText").textContent = weatherInfo.text;
                document.getElementById("humidity").textContent = `${current.relative_humidity_2m}%`;
                document.getElementById("windSpeed").textContent = `${current.wind_speed_10m} km/h`;

            } catch (err) {
                errorMsg.textContent = "Failed to fetch weather data. Check your internet connection.";
            }
        }

        // Event Listeners
        searchBtn.addEventListener("click", () => {
            const city = cityInput.value.trim();
            if (city) getWeather(city);
        });

        cityInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter" && cityInput.value.trim()) {
                getWeather(cityInput.value.trim());
            }
        });

        // Load default city on startup
        getWeather("New Delhi");
    </script>

</body>
</html>
